name: "🔄 Submission State Change"

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write

jobs:
  update-state:
    if: >
      contains(github.event.issue.labels.*.name, 'session-submission') ||
      contains(github.event.issue.labels.*.name, 'session-state-update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine new status
        id: status
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            let status = 'unknown';
            let emoji = '❓';

            if (labels.includes('accepted')) {
              status = 'accepted';
              emoji = '🎉';
            } else if (labels.includes('rejected')) {
              status = 'rejected';
              emoji = '❌';
            } else if (labels.includes('submitted')) {
              status = 'submitted';
              emoji = '📨';
            } else if (labels.includes('pending-submission')) {
              status = 'ready';
              emoji = '🚀';
            }

            core.setOutput('status', status);
            core.setOutput('emoji', emoji);

            // Extract submission file from issue body
            const body = context.payload.issue.body || '';
            const fileMatch = body.match(/Submission File:\s*`(.+?)`/);
            core.setOutput('submission_file', fileMatch ? fileMatch[1] : '');

      - name: Update submission frontmatter
        if: steps.status.outputs.submission_file != '' && steps.status.outputs.status != 'unknown'
        run: |
          FILE="${{ steps.status.outputs.submission_file }}"
          STATUS="${{ steps.status.outputs.status }}"

          if [ -f "$FILE" ]; then
            sed -i "s/^status:.*/status: $STATUS/" "$FILE"
            echo "Updated $FILE status to $STATUS"
          else
            echo "File not found: $FILE"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate dashboard
        run: node scripts/generate-readme.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "${{ steps.status.outputs.emoji }} Update: ${{ github.event.issue.title }} → ${{ steps.status.outputs.status }}"
            git push
          fi

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.status.outputs.status }}';
            const emoji = '${{ steps.status.outputs.emoji }}';

            const messages = {
              'submitted': '📨 Marked as **submitted**. Good luck! Update to `accepted` or `rejected` when you hear back.',
              'accepted': '🎉 **Accepted!** Congratulations! The dashboard has been updated.',
              'rejected': '❌ Marked as **rejected**. The session will be archived during the next cleanup.',
              'ready': '🚀 Ready for submission. Submit through the event\'s CFP platform, then update to `submitted`.'
            };

            if (messages[status]) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `${emoji} ${messages[status]}`
              });
            }
