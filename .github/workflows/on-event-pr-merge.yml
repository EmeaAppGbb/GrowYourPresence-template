name: "🎤 Event PR Merged → Compose Submissions"

on:
  pull_request:
    types: [closed]
    paths:
      - 'events/**/*.md'

permissions:
  issues: write
  contents: write
  pull-requests: read

jobs:
  compose-submissions:
    # Trigger when a PR is merged that either:
    # - Has the 'event-discovery' label, OR
    # - Comes from a discovery/* or copilot/discovery* branch, OR
    # - Has event files changed (paths filter already ensures this workflow only fires for events/)
    if: >
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'event-discovery') ||
        startsWith(github.event.pull_request.head.ref, 'discovery/') ||
        contains(github.event.pull_request.head.ref, 'discovery')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find new event files in PR
        id: find-events
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            const eventFiles = files
              .filter(f => f.filename.startsWith('events/') && f.filename.endsWith('.md') && !f.filename.includes('_template'))
              .map(f => f.filename);

            core.setOutput('event_files', JSON.stringify(eventFiles));
            core.setOutput('count', eventFiles.length);
            core.info(`Found ${eventFiles.length} event files: ${eventFiles.join(', ')}`);

      - name: Create submission issues and assign Copilot
        if: steps.find-events.outputs.count > 0
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const fs = require('fs');
            const eventFiles = JSON.parse('${{ steps.find-events.outputs.event_files }}');

            const { data: repoData } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const baseBranch = repoData.default_branch;

            for (const eventFile of eventFiles) {
              const content = fs.readFileSync(eventFile, 'utf-8');

              // Extract event name from frontmatter
              const nameMatch = content.match(/event_name:\s*["']?(.+?)["']?\s*$/m);
              const eventName = nameMatch ? nameMatch[1] : eventFile.split('/').pop().replace('.md', '');

              const idMatch = content.match(/event_id:\s*["']?(.+?)["']?\s*$/m);
              const eventId = idMatch ? idMatch[1] : 'unknown';

              // Extract CFP URL from frontmatter
              const cfpMatch = content.match(/cfp_url:\s*["']?(.+?)["']?\s*$/m);
              const cfpUrl = cfpMatch ? cfpMatch[1] : 'unknown';

              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📝 Compose Submissions: ${eventName}`,
                labels: ['submission-compose', 'squad:copilot'],
                body: [
                  '## 📝 Submission Composition Task',
                  '',
                  `**Event:** ${eventName}`,
                  `**Event File:** \`${eventFile}\``,
                  `**CFP URL:** ${cfpUrl}`,
                  `**Triggered by:** PR #${context.payload.pull_request.number}`,
                  '',
                  '### Instructions',
                  '',
                  'Execute the **Submission Composer Agent** workflow as defined in `.github/agents/submission-composer.md`.',
                  '',
                  '**Steps:**',
                  `1. Read the event file at \`${eventFile}\` for event details and CFP requirements`,
                  '2. Read `config/speaker-profile.md` for speaker topics and expertise',
                  '3. Read `config/submission-defaults.md` for session format preferences',
                  '4. Read `config/submission-agent-grounding.md` for grounding context',
                  `5. Visit the event CFP page (${cfpUrl}) using Playwright to identify all required fields and limits`,
                  '6. Validate every required CFP field is accounted for in the proposal',
                  '7. Create 1-3 session proposals in `submissions/{year}/{event-slug}/`',
                  `8. Update the event file frontmatter: set \`status: drafting\``,
                  '9. Run `node scripts/generate-readme.js` to update the README dashboard',
                  '10. Create a PR with label `submission-proposal` containing all changes',
                  '',
                  '### Important',
                  '- **Use Playwright** to navigate the CFP page and identify all submission fields and character/word limits',
                  '- Match session topics to both the speaker profile AND the event themes',
                  '- Respect any word/character limits from the CFP',
                  '- Include concrete takeaways and audience value proposition',
                  '- Adapt existing sessions from the speaker profile rather than inventing from scratch',
                  '- Reference `config/submission-agent-grounding.md` for learnings from past submissions',
                  '',
                  '---',
                  '*Auto-created when the event discovery PR was merged.*'
                ].join('\n')
              });

              core.info(`Created submission issue #${issue.number} for ${eventName}`);

              // Assign Copilot Coding Agent to the issue
              try {
                await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: ['copilot-swe-agent[bot]'],
                  agent_assignment: {
                    target_repo: `${context.repo.owner}/${context.repo.repo}`,
                    base_branch: baseBranch,
                    custom_instructions: [
                      `You are the Submission Composer Agent. Follow the workflow in \`.github/agents/submission-composer.md\` exactly.`,
                      '',
                      `Event file: \`${eventFile}\``,
                      `CFP URL: ${cfpUrl}`,
                      '',
                      'Key steps:',
                      '1. Read the event file, speaker profile, submission defaults, and grounding config',
                      '2. Use Playwright MCP to visit the CFP page and identify ALL required fields and their limits',
                      '3. Compose 1-3 session proposals that match the event themes to the speaker expertise',
                      '4. Validate all proposals against CFP field requirements before creating the PR',
                      '5. Create branch `submission/{event-slug}`, commit all files, and open a PR',
                      '6. Label the PR with `submission-proposal`',
                      '7. Always run `node scripts/generate-readme.js` and include README changes',
                      '8. Return to main branch when done'
                    ].join('\n')
                  },
                  headers: {
                    'X-GitHub-Api-Version': '2022-11-28'
                  }
                });
                core.info(`Assigned copilot-swe-agent to submission issue #${issue.number}`);
              } catch (err) {
                core.warning(`Agent assignment failed for issue #${issue.number}: ${err.message}`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `⚠️ Could not auto-assign Copilot Coding Agent. Please assign manually or run the Submission Composer Agent locally via Copilot CLI.\n\nError: ${err.message}`
                });
              }
            }

  update-dashboard:
    if: >
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'event-discovery') ||
        startsWith(github.event.pull_request.head.ref, 'discovery/') ||
        contains(github.event.pull_request.head.ref, 'discovery')
      )
    needs: compose-submissions
    uses: ./.github/workflows/update-dashboard.yml
    with:
      commit_message: "📊 Update dashboard: new event merged from PR #${{ github.event.pull_request.number }}"
